<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>운서랍 | App Check 테스트</title>
<style>body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f7f1e9;color:#493a34;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:100%;max-width:530px;background:#fffcf9;border:1px solid #ead7c4;border-radius:22px;padding:28px;box-shadow:0 12px 35px #80604e20}h1{font-size:23px}p{font-size:14px;line-height:1.8}button{border:0;border-radius:12px;background:#80604e;color:white;padding:15px 20px;cursor:pointer;font-size:14px}button:disabled{opacity:.5;cursor:wait}#status{white-space:pre-wrap;background:#f7f1e9;border-radius:12px;padding:14px;min-height:55px;line-height:1.7;font-size:14px}.muted{font-size:12px;color:#85766d}a{color:#80604e}</style></head>
<body><main><div class="muted">UNSEORAP · SECURITY TEST</div><h1>🔐 운서랍 App Check 연결 테스트</h1><p>실제 고객 정보나 생년월일은 수집하지 않아. 아래 버튼을 누르면 등록한 사이트 키로 Firebase App Check 확인 토큰을 요청해.</p><button id="test" disabled>테스트 준비 중...</button><p id="status" role="status">Firebase 모듈을 불러오는 중...</p><p class="muted">반드시 https://0119bbm.github.io/unseorap/appcheck-test.html 에서 열어줘. 테스트에 성공해도 Firebase의 강제 적용은 아직 켜지 마.</p><p><a href="./">← 운서랍 메인으로 돌아가기</a></p></main>
<script type="module">
const btn=document.getElementById('test');const status=document.getElementById('status');
if(location.protocol==='file:'){status.textContent='파일을 컴퓨터에서 직접 열면 테스트할 수 없어. GitHub에 업로드한 뒤 접속해 줘.';}
else {
  try {
    const [appSdk,checkSdk]=await Promise.all([
      import('https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/13.2.0/firebase-app-check.js')
    ]);
    const config={apiKey:'AIzaSyAMJeMJNZutEbvX02dd-lqJOkMnbTPYK8M',authDomain:'unseorap.firebaseapp.com',projectId:'unseorap',appId:'1:710599627829:web:b33121c0c0ed1b31274d7c'};
    const app=appSdk.initializeApp(config,'unseorap-appcheck-test');
    const appCheck=checkSdk.initializeAppCheck(app,{provider:new checkSdk.ReCaptchaEnterpriseProvider('6LfPrw4uAAAAANSN4_wuf03gB5W3Vr72Z1etpB93'),isTokenAutoRefreshEnabled:true});
    btn.disabled=false;btn.textContent='🔑 App Check 테스트 실행';status.textContent='연결 준비 완료. 버튼을 눌러 확인해 줘.';
    btn.onclick=async()=>{btn.disabled=true;status.textContent='App Check 검증 중...';try{const result=await checkSdk.getToken(appCheck,true);status.textContent=result?.token?'✅ App Check 확인 토큰 발급 성공! 실제 개인정보는 저장하지 않았어.':'토큰이 비어 있어. Firebase 설정을 확인해 줘.';}catch(err){status.textContent='❌ App Check 토큰 발급 실패: '+(err?.code||err?.message||'알 수 없는 오류')+'\n설정한 도메인, 키 종류, 위험 점수 기준 및 브라우저 차단 기능을 확인해 줘.';}finally{btn.disabled=false;}};
  }catch(err){status.textContent='❌ Firebase 라이브러리를 불러오지 못했어: '+(err?.message||'알 수 없는 오류');}
}
</script></body></html>
